<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guardião da Orb</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hud-bar">
        <div class="hud-group">
            <div class="hud-pill" title="Energia Absorvida">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                <span id="score-val">0</span>
            </div>
            <div class="hud-pill timer" title="Tempo Restante">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                <span id="time-val">60s</span>
            </div>
        </div>

        <button type="button" class="btn-exit" onclick="exitArcadeGame()" title="Concluir">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            Concluir
        </button>
    </div>

    <div id="controls-hint">Arraste ao redor do centro para girar o escudo</div>

    <canvas id="game-canvas"></canvas>

    <div id="end-overlay" class="end-overlay">
        <div class="end-card">
            <div class="trophy-icon">
                <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            </div>
            <h2>Fim da Rodada!</h2>
            <p>Energia absorvida: <strong id="final-score">0</strong></p>
            <button type="button" class="btn-finish" onclick="exitArcadeGame()">Voltar para Atividades</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
